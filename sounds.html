<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hit sound options</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #182247; color: #fff3cf; max-width: 560px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; }
    p { color: #b3c4f2; line-height: 1.4; }
    .opt { display: flex; align-items: center; gap: 12px; background: #24397f; border-radius: 12px; padding: 12px; margin: 10px 0; }
    .opt b { display: block; }
    .opt small { color: #b3c4f2; }
    button { font-size: 16px; padding: 12px 18px; border: 0; border-radius: 10px; background: #e2323f; color: #fff; min-width: 96px; }
    button:active { background: #9c1d2c; }
    .num { font-size: 22px; width: 28px; text-align: center; color: #ffd23f; }
  </style>
</head>
<body>
  <h1>Hit sound options</h1>
  <p>Each button plays the game music for a second, then cuts it and plays the hit sound, like in the game. Turn your volume up and your silent switch off.</p>
  <div id="list"></div>
  <p>To try one in the real game, add <code>?sad=N</code> to the game URL. When you pick one, tell me the number.</p>
  <script type="module">
    import { AudioEngine, SAD_VARIANTS } from '/src/audio.js';
    const audio = new AudioEngine();
    const list = document.getElementById('list');
    let timer;
    for (const v of SAD_VARIANTS) {
      const row = document.createElement('div');
      row.className = 'opt';
      row.innerHTML = `<div class="num">${v.id}</div><div style="flex:1"><b>${v.label}</b><small>${v.desc}</small></div>`;
      const btn = document.createElement('button');
      btn.textContent = '▶ Play';
      btn.addEventListener('click', () => {
        audio.unlock();
        clearTimeout(timer);
        audio.stopMusic();
        audio.cut(audio.sadGain);
        audio.startMusic();
        timer = setTimeout(() => { audio.stopMusic(); audio.sfx('hit'); audio.sfx('sad', v.id); }, 1300);
      });
      row.appendChild(btn);
      list.appendChild(row);
    }
  </script>
</body>
</html>
