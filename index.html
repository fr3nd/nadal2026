<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1030">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Kai's Sled · El Trineu del Kai — Merry Christmas 2026 / Bon Nadal 2026">
  <title>Kai's Sled – Merry Christmas 2026</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud">
      <div class="hud-panel">
        <div class="stat"><img id="hud-gift-icon" alt=""><span id="hud-gifts">0</span></div>
        <div class="stat"><span id="hud-m">0</span><small data-i18n="unitM">m</small></div>
      </div>
    </div>

    <button id="mute" class="icon-btn" type="button"><img alt=""></button>
    <div id="toast"></div>

    <div id="controls">
      <button id="pad-left" class="pad" type="button" data-i18n-label="left"><img alt=""></button>
      <button id="pad-right" class="pad" type="button" data-i18n-label="right"><img alt=""></button>
    </div>

    <section id="title" class="screen">
      <h1 data-i18n="title">Kai's Sled</h1>
      <p class="subtitle" data-i18n="subtitle">Merry Christmas 2026</p>
      <p class="panel hint" data-i18n="hint"></p>
      <p class="best" id="title-best"></p>
      <button id="btn-play" class="btn" type="button" data-i18n="play">Play</button>
      <button id="btn-records" class="link" type="button" data-i18n="records" hidden>Records</button>
      <div class="lang" data-i18n-label="language"></div>
    </section>

    <section id="over" class="screen" hidden>
      <h2 data-i18n="gameOver">Game over</h2>
      <p id="record" class="record" data-i18n="newRecord" hidden></p>
      <div class="panel results">
        <div><span data-i18n="gifts">Gifts</span><b id="r-gifts">0</b></div>
        <div><span data-i18n="meters">Meters</span><b id="r-m">0</b></div>
        <div class="total"><span data-i18n="score">Score</span><b id="r-score">0</b></div>
        <div><span data-i18n="bestLabel">Best</span><b id="r-best">0</b></div>
      </div>
      <form id="name-form" hidden autocomplete="off">
        <p class="name-prompt" id="name-prompt"></p>
        <input id="name-input" type="text" maxlength="12" autocapitalize="words" autocorrect="off" spellcheck="false"
               enterkeyhint="done" data-i18n-label="yourName" data-i18n-placeholder="yourName">
        <button id="btn-save" class="btn" type="submit" data-i18n="save">Save</button>
        <button id="btn-skip" class="link" type="button" data-i18n="skip">Skip</button>
      </form>
      <p id="save-msg" class="save-msg" hidden></p>
      <button id="btn-retry" class="btn" type="button" data-i18n="retry">Try again</button>
      <button id="btn-records-over" class="link" type="button" data-i18n="records" hidden>Records</button>
      <div class="lang" data-i18n-label="language"></div>
    </section>

    <section id="board" class="screen" hidden>
      <h2 data-i18n="records">Records</h2>
      <div class="panel board-panel"><div id="board-list" class="scrollable"></div></div>
      <button id="btn-board" class="btn" type="button" data-i18n="back">Back</button>
    </section>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
